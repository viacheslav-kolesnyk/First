{% extends 'core/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container" style="max-width: 500px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h2 class="card-title h4 mb-4">{% if object %}🏷️ Update{% else %}🏷️ Create{% endif %} Tag</h2>

            <form method="post" novalidate>
                {% csrf_token %}
                {{ form|crispy }}

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-dark px-4">Save Tag</button>
                    <a href="{% url 'core:tag-list' %}" class="btn btn-light border">Cancel</a>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}

{% extends 'core/base.html' %}
{% block content %}
<div class="container" style="max-width: 500px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h2 class="card-title h4 mb-4">{% if object %}🏷️ Update{% else %}🏷️ Create{% endif %} Tag</h2>
            <form method="post" novalidate>
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label fw-semibold text-secondary">
                            Tag Name
                        </label>
                        <input type="text" name="{{ field.html_name }}" id="{{ field.id_for_label }}" class="form-control" value="{{ field.value|default:'' }}" placeholder="e.g. Work, Urgent, Personal">
                        {% for error in field.errors %}
                            <div class="text-danger small mt-1">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-dark px-4">Save Tag</button>
                    <a href="{% url 'core:tag-list' %}" class="btn btn-light border">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'core/base.html' %}
{% block content %}
    <h2>Delete Task</h2>
    <p>Are you sure you want to delete "{{ object.content }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
        <a href="{% url 'core:index' %}" style="margin-left:10px;">Cancel</a>
    </form>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; background-color: #f8f9fa; }
        .sidebar { width: 260px; min-height: 100vh; background-color: #212529; color: #fff; padding: 20px; }
        .sidebar a { color: rgba(255,255,255,0.75); text-decoration: none; display: block; padding: 10px; border-radius: 4px; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background-color: #343a40; }
        .main-content { flex: 1; padding: 40px; }
    </style>
</head>
<body>

    <!-- Sidebar navigation mapping -->
    <div class="sidebar d-flex flex-column justify-content-between">
        <div>
            <h4 class="mb-4 text-center">📋 Task Manager</h4>
            <nav class="nav flex-column gap-2">
                <a href="{% url 'core:index' %}" class="nav-link">🏠 Home Page</a>
                <a href="{% url 'core:tag-list' %}" class="nav-link">🏷️ Tag List Page</a>
            </nav>
        </div>
        <div class="text-secondary text-center small">Todo App v1.0</div>
    </div>

    <!-- Main dynamic structural layout container -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
